[project]
name = "atlasclient"
version = "0.1.0"
description = "Client Python để ứng dụng khác (chatbot…) gọi agent, team, workflow của Atlas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasclient"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# Thư mục nằm trên ổ exFAT/NTFS: mọi file đều mang cờ thực thi.
ignore = ["EXE002", "RUF001", "RUF002", "RUF003"]
